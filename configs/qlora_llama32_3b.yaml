# QLoRA SFT config for Llama-3.2-3B-Instruct on the cleaned sql-create-context data.
# Used by scripts/train.py (TRL SFTTrainer + PEFT). Run on a GPU box only.
#
# Targets an NVIDIA L4 (24 GB, EC2 g6.xlarge). For a Colab T4 (16 GB, no bf16):
#   quantization.bnb_4bit_compute_dtype: float16, training.bf16: false, training.fp16: true,
#   and lower per_device_train_batch_size to 8 with gradient_accumulation_steps: 2.

run_name: llama32-3b-qlora-r16
seed: 42

model:
  name: unsloth/Llama-3.2-3B-Instruct
  max_length: 512             # schemas + questions + SQL are short; check truncation stats in W&B
  attn_implementation: sdpa

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  dataset: <hf-user>/sql-create-context-clean   # or a local dir like data/processed
  train_split: train
  eval_split: validation
  max_train_samples: null     # set e.g. 2000 for a smoke test
  max_eval_samples: 500

wandb:
  project: text2sql
  # entity: <your-wandb-entity>

# Passed straight through to trl.SFTConfig.
training:
  output_dir: outputs/llama32-3b-qlora-r16
  num_train_epochs: 1
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0
  optim: paged_adamw_8bit
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  eval_strategy: steps
  eval_steps: 500
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  packing: false
  report_to: wandb
